batch_size: 16
device: "cuda:0"
epochs: 30
lr: 0.001
lr_scheduler: True
optimizer: "adamw"
max_steps_per_epoch: -1

encoder:
  normalization: "batch"
  activation_fn: "relu"
  n_mel: 8
  channels: [32, 64]
  strides: [2, 2]
  res_blocks_per_stage: [1, 1]
decoder:
  hidden_size: 256
  num_layer: 2

train_data:
  dataset_name: "clean"
  split: "train.100"
  shuffle_seeds: 42
  augmentation:
    enable: True
    mel_enable: True
  mel:
    sr: 16000
    n_fft: 400
    hop_len: 160
    n_mels: 80

validation_data:
  dataset_name: "clean"
  split: "validation"
  shuffle_seeds: 42
  augmentation:
    enable: False
    mel_enable: False
  mel:
    sr: 16000
    n_fft: 400
    hop_len: 160
    n_mels: 80

logging_config:
  log_in_cli: True
  log_in_cli_per_step: False
  wandb_enable: True
  wandb_project_name: "SFC"
  wandb_experiment_name: "baseline_full_augm_adamw_scheduler_0.2.1"
  logging_each_n_step: 50
  random_gen_output: 3  
  path_to_log_file: ".logs/log_train.txt"
  path_to_best_model: ".models/exp1/best_model.pt"
  path_to_last_model: ".models/exp1/last_model.pt"