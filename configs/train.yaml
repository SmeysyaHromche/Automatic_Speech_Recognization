batch_size: 16
device: "cuda:0"
epochs: 10
lr: 0.001
max_steps_per_epoch: -1
id_for_model: "SFC0.0.1"
path_to_best_model: ".models/exp1/best_model.pt"
path_to_last_model: ".models/exp1/last_model.pt"

train_data:
  dataset_name: "clean"
  split: "train.100"
  shuffle_seeds: 42
  augmentation:
    enable: False
    mel_enable: False
  mel:
    sr: 16000
    n_fft: 400
    hop_len: 160
    n_mels: 80

validation_data:
  dataset_name: "clean"
  split: "validation"
  shuffle_seeds: 42
  augmentation:
    enable: False
    mel_enable: False
  mel:
    sr: 16000
    n_fft: 400
    hop_len: 160
    n_mels: 80

logging_config:
  log_in_cli: True
  log_in_cli_per_step: True
  wandb_enable: True
  wandb_project_name: "SFC"
  wandb_experiment_name: "baseline_no_audio_augm_no_mel_augm0.0.1"
  logging_each_n_step: 1
  random_gen_output: 3